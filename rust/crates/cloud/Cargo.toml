[package]
name = "pay-cloud"
description = "pay-cloud v0: browser onboarding for the pay CLI (PKCE start/exchange + embedded UI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pay-cloud"
path = "src/main.rs"

[features]
default = ["openfort", "coinflow"]
# Openfort wallet driver: dashboard consent handoff, wallet-secret
# registration and Solana backend wallet creation. Off leaves pay-cloud
# with no custody backend, which is enough to exercise the PKCE handshake.
openfort = ["dep:p256", "dep:reqwest"]
# Card purchases of USDC through Coinflow (`/api/fund/*`, the `/fund` page).
coinflow = ["dep:reqwest", "dep:bs58"]

[dependencies]
async-trait = "0.1"
axum = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true, optional = true }
clap = { workspace = true }
include_dir = "0.7.4"
mime_guess = { workspace = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"], optional = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
